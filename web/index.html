<!doctype html>
<html lang="en" class="i18n-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B3FE0'/%3E%3Crect x='6' y='9' width='20' height='14' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><rect x="6" y="9" width="20" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="16" cy="16" r="3.2" fill="#fff"/></svg>
      <span>PickFlow</span>
    </div>
    <nav class="nav" id="nav" aria-label="Seções">
      <button data-view="chat" class="on">Conversa</button>
      <button data-view="workflows">Workflows e prompts</button>
      <button data-view="loras">LoRAs</button>
      <button data-view="recipes">Casos de uso</button>
      <button data-view="settings">Ajustes</button>
    </nav>
    <div class="convs" id="convs-wrap">
      <div class="convs-head"><span>Conversas</span><button id="new-conv" class="ghost sm" title="Nova conversa">Nova</button></div>
      <ul id="convs"></ul>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<!-- three.js + Spark (visualizador 3D): carregados só quando um 3D é aberto -->
<script type="importmap">{"imports": {"three": "/static/vendor/three/three.module.min.js", "three/addons/": "/static/vendor/three/addons/", "spark": "/static/vendor/spark/spark.module.min.js"}}</script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
