description: Addon de exemplo (gira imagens). Troque pelo que o seu faz.
version: 0.1.0
# Configuração padrão: o usuário muda em settings.yaml > addons.config.__NAME__ (ctx.config no Python, PickFlow.config no JS).
config:
  graus_padrao: 90
