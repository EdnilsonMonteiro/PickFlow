# Arquivos que os workflows do PickFlow usam e que ficam no ComfyUI (pastas models/<folder>/).
# O assistente de primeiros passos (aba Ajustes) lê esta lista, mostra o que falta e só baixa o que você marcar.
#
# Cada autor tem a sua licença: várias são de uso não comercial. Confira a página antes de usar.
# Para acrescentar os seus, crie custom/models.yaml com o mesmo formato (mesmo id = o seu vale mais).
#
#   id        nome curto (letras minúsculas, números e _)
#   file      nome do arquivo como o workflow o chama
#   folder    loras | diffusion_models | text_encoders | vae   (subpasta de models/)
#   url       endereço direto do arquivo (https)
#   page      página do autor, para conferir licença e versão
#   size_gb   tamanho aproximado (opcional; o assistente confirma o tamanho real antes de baixar)

files:
