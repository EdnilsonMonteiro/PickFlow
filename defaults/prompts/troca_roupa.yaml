# Prompts do workflow 'troca_roupa' (Outfit Swap do AusBoss). O texto do prompt vai para o nó "Quem vestir": a frase que diz QUEM da
# foto 1 troca de roupa ("the woman on the left"). A roupa é descrita sozinha por um modelo de visão a partir da foto 2.

default: padrao
presets:
- id: padrao
  name: Trocar a roupa
  when: 'Dress the person of image 1 in the clothing of image 2 (the outfit, a garment, the look). Keeps the face, hair, hands, pose
    and background. It can single out WHO to dress when there are several people ("the woman on the left").'
  text: '{quem}'
  needs: 2
  slots: order
  rewrite: false
  auto_loras: false
  vars:
  - key: quem
    kind: choice
    label: Quem trocar
    default: person
    question: Which person of image 1 does the request single out? If the photo has only one person, or the request does not say
      which one, choose "the person". When there are several people, use where each one stands (left, right, middle) and
      whether the request says woman or man. Do NOT use clothing to name the person.
    options:
    - id: person
      name: A pessoa
      when: There is only one person in image 1, or the request does not single anyone out. It is the default.
      text: the person
    - id: woman
      name: A mulher
      when: The request says "the woman" (or the girl) and there is only one woman in image 1.
      text: the woman
    - id: man
      name: O homem
      when: The request says "the man" (or the boy) and there is only one man in image 1.
      text: the man
    - id: person_left
      name: A pessoa da esquerda
      when: Several people; the request singles out the one on the left (image 1 seen from the front), without saying woman or man.
      text: the person on the left
    - id: person_right
      name: A pessoa da direita
      when: Several people; the request singles out the one on the right, without saying woman or man.
      text: the person on the right
    - id: person_center
      name: A pessoa do meio
      when: Several people; the request singles out the one in the middle, without saying woman or man.
      text: the person in the middle
    - id: woman_left
      name: A mulher da esquerda
      when: Several people; the request singles out the woman on the left.
      text: the woman on the left
    - id: woman_right
      name: A mulher da direita
      when: Several people; the request singles out the woman on the right.
      text: the woman on the right
    - id: man_left
      name: O homem da esquerda
      when: Several people; the request singles out the man on the left.
      text: the man on the left
    - id: man_right
      name: O homem da direita
      when: Several people; the request singles out the man on the right.
      text: the man on the right
