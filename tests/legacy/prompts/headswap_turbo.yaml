# Prompts do workflow 'headswap_turbo'. Use {request} onde o pedido do usuário entra.

default: bfs_head
presets:
- id: bfs_head
  name: BFS Head Swap
  when: Troca de rosto padrão.
  text: 'head_swap: start with <image1> as the base image, keeping its lighting, environment, and background. remove
    the head from <image1> completely and replace it with the head from <image2>, strictly preserving the hair,
    eye color, nose structure from <image2>. copy the direction of the eye, head rotation, micro expressions from
    <image1>, high quality, sharp details, 4k.'
  rewrite: false
- id: bfs_head_extra
  name: BFS Head Swap + instruções
  when: Quando há instruções extras (expressão, cabelo).
  text: |-
    head_swap: start with <image1> as the base image, keeping its lighting, environment, and background. remove the head from <image1> completely and replace it with the head from <image2>, strictly preserving the hair, eye color, nose structure from <image2>. copy the direction of the eye, head rotation, micro expressions from <image1>, high quality, sharp details, 4k.
    Extra instructions: {request}
  rewrite: false
